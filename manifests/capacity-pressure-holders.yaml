apiVersion: v1
kind: Pod
metadata:
  name: guaranteed-holder-1
  namespace: default
spec:
  containers:
  - name: holder
    image: python:3.12-slim
    command:
    - python3
    - -c
    - |
      import mmap, time
      size = 1 * 1024 * 1024 * 1024  # 1Gi actual usage
      m = mmap.mmap(-1, size)
      m.write(b'\x01' * size)
      print(f"Allocated and touched {size // (1024*1024)}Mi", flush=True)
      while True:
          time.sleep(60)
    resources:
      requests:
        memory: "7Gi"
        cpu: "250m"
      limits:
        memory: "7Gi"
        cpu: "250m"
  restartPolicy: Never
---
