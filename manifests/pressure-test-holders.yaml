apiVersion: v1
kind: Pod
metadata:
  name: guaranteed-holder
  namespace: default
spec:
  containers:
  - name: holder
    image: python:3.12-slim
    command:
    - python3
    - -c
    - |
      import mmap, time, os
      size = 100 * 1024 * 1024  # 100Mi
      m = mmap.mmap(-1, size)
      m.write(b'\x01' * size)  # fault all pages
      print(f"Allocated and touched {size // (1024*1024)}Mi", flush=True)
      while True:
          time.sleep(60)
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "256Mi"
        cpu: "250m"
  restartPolicy: Never
---
