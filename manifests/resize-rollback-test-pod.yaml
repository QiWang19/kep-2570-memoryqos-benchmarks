apiVersion: v1
kind: Pod
metadata:
  name: memqos-resize-rollback-test
  namespace: default
spec:
  containers:
  - name: test
    image: registry.k8s.io/pause:3.10
    resizePolicy:
    - resourceName: memory
      restartPolicy: NotRequired
    - resourceName: cpu
      restartPolicy: NotRequired
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
  restartPolicy: Never
